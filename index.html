<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電路闖關 CH3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap">
<style>
:root {
	/* 版面：方格紙實驗桌。墨色電路線、白色貼紙卡（粗框＋硬陰影），六個關卡用電阻色碼 1~7 上色。 */
	color-scheme: light;
	--paper: #eef3f8;
	--grid: #d9e3ee;
	--ink: #1b2130;
	--muted: #556073;
	--card: #ffffff;
	--flow: #f0a202;
	--glow: #ffd23f;
	--lcd: #cbd9b4;
	--lcd-ink: #1d2915;
	--good: #1d9a52;
	--bad: #d23f3f;
	--b1: #8a5a2e; --b2: #d4382c; --b3: #ec8a1c; --b4: #e3b81a; --b5: #2b9a55; --b6: #2d6cd2; --b7: #8a4fd0;
	--font-display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
	--font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
	--font-lcd: "Share Tech Mono", ui-monospace, Consolas, monospace;
	--lv: var(--ink);
	--lv-text: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	background-color: var(--paper);
	background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
	background-size: 24px 24px;
	color: var(--ink);
	font-family: var(--font-body);
	font-size: 16px;
	line-height: 1.6;
}
h1, h2, h3, h4 { text-wrap: balance; }
sub { font-size: 0.7em; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
main.wrap { padding-bottom: 72px; }

/* 頂欄 */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 2.5px solid var(--ink); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 34px; height: 18px; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.chip .star { color: var(--b4); -webkit-text-stroke: 0.6px var(--ink); }

/* 按鈕：貼紙 */
.btn { font: inherit; font-weight: 700; color: var(--ink); background: var(--card); border: 2.5px solid var(--ink); border-radius: 10px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; transition: transform .08s, box-shadow .08s; line-height: 1.4; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--ink); }
.btn.primary { background: var(--lv); color: var(--lv-text); }
.btn.small { padding: 4px 10px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--card); }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--b6); outline-offset: 2px; }

/* 地圖首頁 */
.hero { padding: 36px 0 8px; display: grid; gap: 14px; }
.eyebrow { margin: 0; font-weight: 700; color: var(--muted); letter-spacing: .08em; font-size: 14px; }
h1 { font-family: var(--font-display); font-size: clamp(48px, 9vw, 92px); line-height: 1; margin: 0; letter-spacing: .02em; }
h1 .zap { color: var(--flow); -webkit-text-stroke: 2px var(--ink); }
.lede { margin: 0; max-width: 34em; font-size: 18px; color: var(--muted); }
.trace-box { background: var(--card); border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); padding: 10px 12px; overflow-x: auto; }
.trace { display: block; width: 100%; min-width: 660px; height: auto; }
.trace .rbtn { cursor: pointer; }
.trace .rbtn:hover rect.body, .trace .rbtn:focus rect.body { stroke-width: 4; }
.trace-note { margin: 6px 4px 0; font-size: 14px; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 22px; margin-top: 28px; }
.lcard { display: grid; grid-template-columns: 22px 1fr; background: var(--card); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); overflow: hidden; }
.lcard .band { background: var(--lv); border-right: 2.5px solid var(--ink); background-image: linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,.18) 7px 9px, transparent 9px); }
.lbody { padding: 16px 18px 18px; display: grid; gap: 4px; align-content: start; }
.lmeta { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.lcard h3 { margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.2; }
.ltopic { margin: 0; font-weight: 700; }
.lblurb { margin: 2px 0 8px; color: var(--muted); font-size: 15px; }
.lfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: auto; }
.stars { font-size: 22px; letter-spacing: 2px; line-height: 1; }
.stars .on { color: var(--b4); -webkit-text-stroke: 1px var(--ink); }
.stars .off { color: var(--grid); -webkit-text-stroke: 1px var(--muted); }
.mapfoot { margin-top: 30px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; }

/* 關卡頁 */
.lhead { display: flex; align-items: center; gap: 16px; padding: 26px 0 6px; flex-wrap: wrap; }
.lhead h2 { margin: 0; font-family: var(--font-display); font-size: clamp(32px, 5vw, 48px); line-height: 1.1; }
.badge { width: 96px; height: 40px; flex: none; }
.block { margin-top: 30px; }
.block > h3 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-family: var(--font-display); font-size: 28px; }
.block > h3 .num { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--lv); color: var(--lv-text); border: 2.5px solid var(--ink); font-family: var(--font-body); font-size: 17px; font-weight: 900; transform: translateY(4px); }
.block > h3 small { font-family: var(--font-body); font-size: 15px; color: var(--muted); font-weight: 500; }
.tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tip { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 12px 14px; }
.tip h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: 20px; }
.tip p { margin: 0; }
.tip .f { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 6px; background: var(--paper); border: 1.5px solid var(--grid); font-weight: 700; }
.tip.trap { background: #fff3f1; border-color: var(--bad); }
.tip.trap h4 { color: var(--bad); }

.sim { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; background: var(--card); border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); padding: 16px; }
@media (max-width: 880px) { .sim { grid-template-columns: 1fr; } }
.stage { background: #fbfcfe; border: 2px solid var(--grid); border-radius: 12px; padding: 6px; align-self: start; }
.stage svg { width: 100%; height: auto; display: block; }
.panel { display: grid; gap: 10px; align-content: start; min-width: 0; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.ctrl { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) 4.4em; align-items: center; gap: 10px; }
.ctrl.c4 { grid-template-columns: 2.2em minmax(0, 1fr) 3.4em 4.6em; }
.ctrl label { font-weight: 700; }
.ctrl output { font-family: var(--font-lcd); font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--lv); height: 28px; }
.lcds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lcd { background: var(--lcd); color: var(--lcd-ink); border: 2px solid var(--ink); border-radius: 8px; padding: 4px 10px 6px; box-shadow: inset 0 3px 0 rgba(0, 0, 0, .1); min-width: 0; }
.lcd small { display: block; font-size: 12px; font-weight: 700; }
.lcd b { font-family: var(--font-lcd); font-size: 24px; font-weight: 400; font-variant-numeric: tabular-nums; }
.steps { font-size: 15px; background: var(--paper); border: 2px dashed var(--muted); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; }
table.read { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.read th, table.read td { border-bottom: 1.5px solid var(--grid); padding: 3px 6px; text-align: right; }
table.read th:first-child, table.read td:first-child { text-align: left; }
.status { font-weight: 700; padding: 6px 12px; border-radius: 8px; border: 2px solid; }
.status.ok { border-color: var(--good); color: var(--good); background: #e9f7ef; }
.status.no { border-color: var(--bad); color: var(--bad); background: #fdeeee; }
.split { display: flex; height: 26px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.split span { display: block; height: 100%; transition: width .15s; }
.split .loss { background: var(--bad); }
.split .keep { background: var(--good); }
.legend { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; flex-wrap: wrap; }
.legend .l { color: var(--bad); } .legend .k { color: var(--good); }
.ride-log { margin: 0; padding-left: 1.2em; font-size: 15px; min-height: 2em; }
.ride-log .sum { font-weight: 900; color: var(--good); list-style: none; margin-left: -1.2em; }
.frows { display: grid; gap: 6px; }
.frow { padding: 6px 10px; border: 2px solid var(--grid); border-radius: 8px; cursor: pointer; font-size: 15px; }
.frow.on { border-color: var(--b6); background: #eef4ff; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }

.missions { display: grid; gap: 8px; margin-top: 14px; }
.missions .mtitle { margin: 0; font-weight: 900; }
.mission { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); }
.mission .box { width: 22px; height: 22px; border: 2.5px solid var(--ink); border-radius: 5px; flex: none; display: grid; place-items: center; margin-top: 2px; font-weight: 900; font-size: 14px; }
.mission.done { background: #e9f7ef; }
.mission.done .box { background: var(--good); border-color: var(--good); color: #fff; }
.mission .xp { margin-left: auto; font-weight: 700; color: var(--muted); white-space: nowrap; font-size: 14px; }

/* 挑戰 */
.quiz { background: var(--card); border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); padding: 20px; }
.qhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-weight: 700; }
.pips { display: flex; gap: 6px; flex-wrap: wrap; }
.pip { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); }
.pip.ok { background: var(--good); } .pip.no { background: var(--bad); } .pip.now { background: var(--lv); }
.combo { font-family: var(--font-display); color: var(--b2); font-size: 20px; }
.hearts { color: var(--bad); letter-spacing: 3px; font-size: 20px; }
.hearts .lost { color: var(--grid); }
.qtext { font-size: 20px; font-weight: 700; margin: 14px 0 16px; max-width: 40em; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; font-size: 17px; font-weight: 700; }
.opt.right { background: var(--good); color: #fff; }
.opt.wrong { background: var(--bad); color: #fff; animation: shake .35s; }
.feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; border: 2.5px solid var(--ink); background: var(--paper); display: grid; gap: 8px; }
.feedback.good { border-color: var(--good); }
.feedback.bad { border-color: var(--bad); }
.feedback .verdict { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.feedback.good .verdict { color: var(--good); } .feedback.bad .verdict { color: var(--bad); }
.feedback .row { display: flex; justify-content: flex-end; }
.result { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 10px 0; }
.result .big { font-family: var(--font-display); font-size: 56px; line-height: 1; }
.result .stars { font-size: 46px; }
.result .rank { font-family: var(--font-display); font-size: 80px; line-height: 1; color: var(--lv); -webkit-text-stroke: 2px var(--ink); }
.result .acts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.lnav { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.toast { position: fixed; top: 64px; right: 18px; z-index: 50; background: var(--ink); color: var(--card); padding: 8px 14px; border-radius: 10px; font-weight: 700; box-shadow: 3px 3px 0 var(--flow); animation: toast 1.9s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* SVG 電路零件 */
svg text { font-family: var(--font-body); }
.wire { stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dots { stroke: var(--flow); stroke-width: 7; fill: none; stroke-dasharray: 0.1 18; stroke-linecap: round; }
.plate { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.res { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.res.adj { fill: #fff2d9; stroke: var(--b3); stroke-width: 3.5; }
.res.hl { fill: #dce9ff; stroke: var(--b6); stroke-width: 3.5; }
.res.hl2 { fill: #ffe1dc; stroke: var(--b2); stroke-width: 3.5; }
.lbl { font-size: 15px; fill: var(--ink); font-weight: 700; }
.val { font-size: 14px; fill: var(--muted); font-weight: 500; }
.cap { font-size: 14px; fill: var(--muted); font-weight: 700; }
.pm { font-size: 15px; fill: var(--ink); font-weight: 900; }
.srcbox { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
.halo { fill: var(--glow); }
.glass { fill: var(--card); }
.glowfill { fill: var(--glow); }
.filament { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.ring { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.csrc { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.arrow { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.gridl { stroke: var(--grid); stroke-width: 1.5; }
.zero { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.vline { fill: none; stroke: var(--b3); stroke-width: 3.5; stroke-linejoin: round; }
.vdot { fill: var(--b3); stroke: var(--ink); stroke-width: 2; }
.cart { fill: var(--b2); stroke: var(--ink); stroke-width: 2.5; }
.node { stroke: var(--ink); stroke-width: 3; }
.node.ok { fill: var(--good); }
.node.no { fill: var(--bad); animation: blink .7s infinite alternate; }
@keyframes blink { to { opacity: .45; } }
.bar-in { fill: var(--b6); stroke: var(--ink); stroke-width: 2; }
.bar-out { fill: var(--b5); stroke: var(--ink); stroke-width: 2; }
.face { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.dial { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.needle { stroke: var(--b2); stroke-width: 4; stroke-linecap: round; transition: all .12s; }
.shackle { fill: none; stroke: var(--ink); stroke-width: 4.5; transition: transform .4s; }
.lock.open .shackle { transform: translateY(-9px); }
.lockbody { fill: var(--b3); stroke: var(--ink); stroke-width: 2.5; }
.lock.open .lockbody { fill: var(--good); }
.trace .lit { stroke: var(--flow); stroke-width: 7; fill: none; stroke-dasharray: 0.1 16; stroke-linecap: round; animation: flow .7s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -16.1; } }

@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
	<div class="wrap">
		<button class="brand" id="brand" type="button" aria-label="回到關卡地圖">
			<svg viewBox="0 0 34 18" aria-hidden="true"><line x1="0" y1="9" x2="7" y2="9" stroke="#1b2130" stroke-width="2.5"/><rect x="7" y="3" width="20" height="12" rx="3" fill="#fff" stroke="#1b2130" stroke-width="2.5"/><rect x="11" y="3" width="3" height="12" fill="#ec8a1c"/><rect x="17" y="3" width="3" height="12" fill="#2d6cd2"/><line x1="27" y1="9" x2="34" y2="9" stroke="#1b2130" stroke-width="2.5"/></svg>
			電路闖關
		</button>
		<span class="spacer"></span>
		<span class="chip" id="chip-stars"><span class="star" aria-hidden="true">★</span> <span id="stars-n">0</span> / 18</span>
		<span class="chip" id="chip-xp">XP <span id="xp-n">0</span></span>
		<button class="btn small" id="sound-btn" type="button" aria-pressed="true">音效 開</button>
	</div>
</header>
<main class="wrap" id="view"></main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
'use strict';

/* ---------- 小工具 ---------- */
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const SVGNS = 'http://www.w3.org/2000/svg';
function h(tag, attrs, ...kids) {
	const el = document.createElement(tag);
	if (attrs) for (const [k, v] of Object.entries(attrs)) {
		if (v == null || v === false) continue;
		if (k === 'class') el.className = v;
		else if (k === 'html') el.innerHTML = v;
		else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
		else el.setAttribute(k, v === true ? '' : v);
	}
	for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
	return el;
}
function s(tag, attrs, ...kids) {
	const el = document.createElementNS(SVGNS, tag);
	if (attrs) for (const [k, v] of Object.entries(attrs)) {
		if (v == null) continue;
		if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
		else el.setAttribute(k, v);
	}
	for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
	return el;
}
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(x) { if (!isFinite(x)) return '∞'; let r = Math.round(x * 100) / 100; if (Object.is(r, -0)) r = 0; return String(r); }
const nice = x => isFinite(x) && Math.abs(x * 2 - Math.round(x * 2)) < 1e-9;
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; }
const par = (a, b) => a * b / (a + b);
const signed = v => (v >= 0 ? '+' : '−') + fmt(Math.abs(v));

/* ---------- 存檔 ---------- */
const KEY = 'ch3-circuit-quest-v1';
const fresh = () => ({ xp: 0, stars: {}, bossWin: false, bossBest: 0, missions: {}, locks: 0, sound: true });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { /* 沒有 localStorage 也能玩 */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 忽略 */ } }

/* ---------- 音效 ---------- */
let actx = null;
function tone(freq, dur, type, when, vol) {
	if (!S.sound) return;
	try {
		actx = actx || new (window.AudioContext || window.webkitAudioContext)();
		const t0 = actx.currentTime + (when || 0);
		const o = actx.createOscillator(), g = actx.createGain();
		o.type = type || 'sine'; o.frequency.value = freq;
		g.gain.setValueAtTime(vol || 0.12, t0);
		g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
		o.connect(g).connect(actx.destination);
		o.start(t0); o.stop(t0 + dur + 0.02);
	} catch (e) { /* 瀏覽器不給播就算了 */ }
}
const sfx = {
	good() { tone(660, .12, 'triangle'); tone(990, .2, 'triangle', .1); },
	bad() { tone(150, .28, 'sawtooth', 0, .07); },

const cv = document.getElementById('confetti');

	cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	cctx.clearRect(0, 0, innerWidth, innerHeight);

/* ---------- 挑戰引擎 ---------- */
function quiz(root, { gens, count, lives, onDone }) {
	const box = h('div', { class: 'quiz' });
	root.append(box);
	let order, idx, right, combo, best, hp, gained, res, cur;
	function reset() {
		order = []; while (order.length < count) order.push(...shuffle(gens)); order = order.slice(0, count);
		idx = 0; right = 0; combo = 0; best = 0; hp = lives || 0; gained = 0; res = [];
		ask();
	}
	function head() {
		const pips = h('div', { class: 'pips', 'aria-label': `第 ${idx + 1} 題，共 ${count} 題` });
		for (let i = 0; i < count; i++) pips.append(h('span', { class: 'pip' + (res[i] === true ? ' ok' : res[i] === false ? ' no' : i === idx ? ' now' : '') }));
		const hd = h('div', { class: 'qhead' }, pips, h('span', null, `第 ${Math.min(idx + 1, count)} / ${count} 題`));
		if (lives) { const hs = h('span', { class: 'hearts', 'aria-label': `剩 ${hp} 顆愛心` }); for (let i = 0; i < lives; i++) hs.append(h('span', { class: i < hp ? '' : 'lost' }, '♥')); hd.append(hs); }
		if (combo >= 2) hd.append(h('span', { class: 'combo' }, `連擊 ×${combo}`));
		return hd;
	}
	function ask() {
		cur = order[idx]();
		box.replaceChildren(head(), h('p', { class: 'qtext', html: cur.q }));
		const grid = h('div', { class: 'opts' });
		cur.opts.forEach(o => { const b = h('button', { class: 'btn opt', type: 'button' }, o); b.dataset.v = o; b.addEventListener('click', () => answer(b, o, grid)); grid.append(b); });
		box.append(grid);
	}
	function answer(btn, o, grid) {
		const ok = o === cur.correct;
		grid.querySelectorAll('button').forEach(b => { b.disabled = true; if (b.dataset.v === cur.correct) b.classList.add('right'); });
		if (!ok) btn.classList.add('wrong');
		res[idx] = ok;
		const fb = h('div', { class: 'feedback ' + (ok ? 'good' : 'bad'), 'aria-live': 'polite' });
		if (ok) {
			right++; combo++; best = Math.max(best, combo);
			const gain = 10 + (combo >= 2 ? (combo - 1) * 2 : 0);
			gained += gain; S.xp += gain; save(); renderStats(); sfx.good();
			const r = btn.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, 28);
			fb.append(h('div', { class: 'verdict' }, combo >= 2 ? `答對！連擊 ×${combo}，+${gain} XP` : `答對！+${gain} XP`));
		} else {
			combo = 0; if (lives) hp--; sfx.bad();
			fb.append(h('div', { class: 'verdict' }, '差一點！'), h('div', null, '正確答案：', h('b', null, cur.correct)));
		}
		fb.append(h('div', { html: cur.ex }));
		const last = idx + 1 >= count || (lives && hp <= 0);
		const nb = h('button', { class: 'btn primary', type: 'button' }, last ? '看結果' : '下一題');
		nb.addEventListener('click', () => { if (last) finish(); else { idx++; ask(); box.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }); } });
		fb.append(h('div', { class: 'row' }, nb));
		box.replaceChild(head(), box.firstChild);
		box.append(fb);
		nb.focus({ preventScroll: true });
	}
	function finish() {
		const stars = lives ? 0 : right >= count ? 3 : right >= count - 1 ? 2 : right >= Math.ceil(count * 0.6) ? 1 : 0;
		const r = { right, count, stars, best, gained, hp };
		box.replaceChildren(h('div', { class: 'result' }, ...onDone(r, reset)));
	}
	reset();
}

		s('text', { x: bx, y: 114, class: 'val', 'text-anchor': 'middle' }, full ? '燈亮了！' : '等你點亮'));
	bg.addEventListener('click', () => go('boss'));
	bg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go('boss'); } });
	svg.append(bg);
	return svg;
}
function showMap() {
	setLv(null); clearView();
	const k = clearedRun();
	view.append(
		h('section', { class: 'hero' },
			h('p', { class: 'eyebrow' }, '基本電學 第三章　串並聯電路'),
			h('h1', { html: '電路<span class="zap">闖關</span>' }),
			h('p', { class: 'lede' }, '每過一關，電流就往前流一格。六關都拿到星星、再打倒 Boss，最右邊的燈泡就會亮起來。'),
			h('div', { class: 'trace-box' }, traceSVG(), h('p', { class: 'trace-note' }, k === 0 ? '從第 1 關開始，點電阻就能進入關卡。' : k < 6 ? `電流已經流過 ${k} 關，下一站是第 ${k + 1} 關。` : S.bossWin ? '全部通關！燈泡亮了。' : '六關全破！去打 Boss 把燈點亮。'))
		)
	);
	const grid = h('div', { class: 'levels' });
	[...LEVELS, BOSS].forEach(L => {
		const isBoss = L === BOSS, st = S.stars[L.n] || 0;
		grid.append(h('article', { class: 'lcard', style: `--lv:${L.color};--lv-text:${L.text}` },
			h('div', { class: 'band', 'aria-hidden': 'true' }),
			h('div', { class: 'lbody' },
				h('p', { class: 'lmeta' }, `${isBoss ? '最終關' : '第 ' + L.n + ' 關'} · 色碼 ${L.n} ${L.band}`),
				h('h3', null, L.title),
				h('p', { class: 'ltopic' }, L.topic),
				h('p', { class: 'lblurb' }, L.blurb),
				h('div', { class: 'lfoot' },
					isBoss ? h('span', { class: 'lmeta' }, S.bossWin ? `已打倒，最佳 ${S.bossBest} / 10` : `最佳 ${S.bossBest} / 10`) : starRow(st),
					h('button', { class: 'btn primary', type: 'button', onclick: () => go(isBoss ? 'boss' : 'level-' + L.n) }, (isBoss ? S.bossBest : st) ? '再玩一次' : '開始')))));
	});
	view.append(grid);
	const resetBtn = h('button', { class: 'btn small', type: 'button' }, '重設進度');
	let armed = false;
	resetBtn.addEventListener('click', () => {
		if (!armed) { armed = true; resetBtn.textContent = '再按一次確認清除'; setTimeout(() => { armed = false; resetBtn.textContent = '重設進度'; }, 4000); return; }
		const snd = S.sound; S = fresh(); S.sound = snd; save(); renderStats(); showMap();
	});
	view.append(h('div', { class: 'mapfoot' }, h('span', null, '進度只存在這台裝置的瀏覽器裡。'), resetBtn));
}
function blockTitle(num, title, sub) { return h('h3', null, h('span', { class: 'num' }, num), title, sub ? h('small', null, sub) : null); }
function showLevel(n) {
	const L = LEVELS[n - 1];
	setLv(L); clearView();
	view.append(h('div', { class: 'lhead' },
		h('button', { class: 'btn small', type: 'button', onclick: () => go('map') }, '← 回地圖'),
		resistorBadge(L),
		h('div', null, h('p', { class: 'lmeta' }, `第 ${n} 關 · ${L.topic}`), h('h2', null, L.title))));
	const tips = h('div', { class: 'tips' });
	L.tips.forEach(([t, p, f, trap]) => tips.append(h('div', { class: 'tip' + (trap ? ' trap' : '') }, h('h4', null, t), p ? h('p', { html: p }) : null, f ? h('span', { class: 'f', html: f }) : null)));
	view.append(h('section', { class: 'block' }, blockTitle('1', '秘笈', '先花兩分鐘看完'), tips));
	const lab = h('section', { class: 'block' }, blockTitle('2', '實驗台', '拉滑桿，電流的光點會跟著變快變慢'));
	view.append(lab);
	L.sim(lab);
	const qs = h('section', { class: 'block' }, blockTitle('3', '挑戰', '5 題：答對 3 題 1 星、4 題 2 星、全對 3 星'));
	view.append(qs);
	quiz(qs, {
		gens: BANK[n - 1], count: 5,
		onDone(r, again) {
			const before = S.stars[n] || 0;
			if (r.stars > before) { S.stars[n] = r.stars; save(); renderStats(); }
			if (r.stars > 0) { sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 90); }
			const nextName = n < 6 ? 'level-' + (n + 1) : 'boss';
			return [
				h('div', { class: 'big' }, `${r.right} / ${r.count}`),
				starRow(r.stars),
				h('p', null, r.stars ? `${r.stars > before ? '新紀錄！' : ''}這回合拿到 ${r.gained} XP，最高連擊 ${r.best}。` : `這回合拿到 ${r.gained} XP。答對 3 題就有星星，看完上面的解說再試一次！`),
				h('div', { class: 'acts' },
					h('button', { class: 'btn', type: 'button', onclick: again }, '再挑戰一次'),
					h('button', { class: 'btn primary', type: 'button', onclick: () => go(nextName) }, n < 6 ? '下一關' : '去打 Boss'))
			];
		}
	});
	view.append(h('nav', { class: 'lnav', 'aria-label': '關卡切換' },
		n > 1 ? h('button', { class: 'btn', type: 'button', onclick: () => go('level-' + (n - 1)) }, `← 第 ${n - 1} 關 ${LEVELS[n - 2].title}`) : h('span'),
		n < 6 ? h('button', { class: 'btn', type: 'button', onclick: () => go('level-' + (n + 1)) }, `第 ${n + 1} 關 ${LEVELS[n].title} →`) : h('button', { class: 'btn', type: 'button', onclick: () => go('boss') }, 'Boss 戰 →')));
}
function showBoss() {
	setLv(BOSS); clearView();
	view.append(h('div', { class: 'lhead' },
		h('button', { class: 'btn small', type: 'button', onclick: () => go('map') }, '← 回地圖'),
		resistorBadge(BOSS),
		h('div', null, h('p', { class: 'lmeta' }, '最終關 · 六關混合題'), h('h2', null, BOSS.title))));
	const qs = h('section', { class: 'block' }, blockTitle('!', '開打', '10 題、3 顆愛心，答錯扣一顆，愛心用完就結束'));
	view.append(qs);
	const gens = BANK.flat();
	quiz(qs, {
		gens, count: 10, lives: 3,
		onDone(r, again) {
			const win = r.hp > 0, rank = r.right === 10 ? 'S' : r.right >= 8 ? 'A' : r.right >= 6 ? 'B' : 'C';
			if (r.right > S.bossBest) S.bossBest = r.right;
			if (win && !S.bossWin) S.bossWin = true;
			save(); renderStats();
			if (win) { sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 140); }
			return [
				h('div', { class: 'rank' }, rank),
				h('div', { class: 'big' }, `${r.right} / ${r.count}`),
				h('p', null, win ? `打倒 Boss！剩 ${r.hp} 顆愛心，這場拿到 ${r.gained} XP。回地圖看看燈泡。` : `愛心用完了，答對 ${r.right} 題。錯的題目回到那一關的秘笈複習一下再來！`),
				h('div', { class: 'acts' }, h('button', { class: 'btn', type: 'button', onclick: again }, '再打一次'), h('button', { class: 'btn primary', type: 'button', onclick: () => go('map') }, '回地圖'))
			];
		}
	});
}
function render(name) {
	const m = /^level-([1-6])$/.exec(name || '');
	route = m ? name : name === 'boss' ? 'boss' : 'map';
	if (m) showLevel(+m[1]); else if (route === 'boss') showBoss(); else showMap();
}
function go(name) {
	sfx.click();
	if (location.hash.slice(1) !== name) { try { location.hash = name; } catch (e) { /* 忽略 */ } }
	if (route !== name) render(name);
}
window.addEventListener('hashchange', () => { const n = location.hash.slice(1) || 'map'; if (n !== route) render(n); });
document.getElementById('brand').addEventListener('click', () => go('map'));
document.getElementById('sound-btn').addEventListener('click', () => { S.sound = !S.sound; save(); renderStats(); sfx.click(); });

window.__ch3 = { BANK, calc1, fmt };
function start(data) { renderStats(); render((data && data.route) || location.hash.slice(1) || 'map'); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ route }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
